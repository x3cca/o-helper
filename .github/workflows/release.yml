name: Release

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to build, using upstream.OHelper patch format such as v0.260.1'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-2022
    steps:
    - name: Resolve release version
      id: release-version
      shell: pwsh
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
      run: |
        $tag = $env:RELEASE_TAG.Trim()
        if ($tag -notmatch '^v?\d+\.\d+\.\d+(\.\d+)?$') {
          throw "Release tag '$tag' must be numeric and updater-compatible, for example v0.260.1."
        }

        $version = $tag.TrimStart('v')
        "release_tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
        "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Verify exact release tag
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ steps.release-version.outputs.release_tag }}
      run: |
        gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" --silent

    - uses: actions/checkout@v4
      with:
        ref: refs/tags/${{ steps.release-version.outputs.release_tag }}
        fetch-depth: 0
        persist-credentials: false

    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.301'

    - name: Restore locked dependencies
      run: dotnet restore app/OHelper.sln --locked-mode --runtime win-x64 -p:Platform=x64

    - name: Publish
      run: |
        dotnet publish app/OHelper.sln --configuration Release --runtime win-x64 --no-restore -p:Platform=x64 -p:PublishSingleFile=true --no-self-contained -p:AssemblyVersion=$env:RELEASE_VERSION -p:FileVersion=$env:RELEASE_VERSION -p:Version=$env:RELEASE_VERSION

    - name: Prepare unsigned release files
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $source = 'app/bin/x64/Release/net8.0-windows/win-x64/publish/OHelper.exe'
        if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
          throw "Published executable was not found at '$source'."
        }

        New-Item -ItemType Directory -Path release -Force | Out-Null
        Copy-Item -LiteralPath $source -Destination release/OHelper.exe -Force
        Compress-Archive -LiteralPath release/OHelper.exe -DestinationPath release/OHelper.zip -Force

        $exeHash = (Get-FileHash -Algorithm SHA256 -LiteralPath release/OHelper.exe).Hash.ToLowerInvariant()
        $zipHash = (Get-FileHash -Algorithm SHA256 -LiteralPath release/OHelper.zip).Hash.ToLowerInvariant()
        @(
          "$exeHash  OHelper.exe"
          "$zipHash  OHelper.zip"
        ) | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding ascii

    - name: Upload unsigned workflow artifact
      uses: actions/upload-artifact@v4
      with:
        name: OHelper-unsigned-${{ steps.release-version.outputs.release_tag }}
        path: release/

    - name: Generate SLSA build provenance attestation
      uses: actions/attest-build-provenance@v2
      with:
        subject-path: |
          release/OHelper.exe
          release/OHelper.zip

    - name: Upload unsigned release files
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload "$env:RELEASE_TAG" `
          release/OHelper.exe `
          release/OHelper.zip `
          release/SHA256SUMS.txt `
          --clobber
