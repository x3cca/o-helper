name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v7
    - name: Setup dotnet
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.301'
    - name: Restore locked dependencies
      run: dotnet restore app/OHelper.sln --locked-mode
    - name: Build
      run: dotnet build app/OHelper.sln --no-restore
