name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
  - cron: '34 18 * * 3'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v7
    - name: Setup dotnet
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.301'
    - name: Restore locked dependencies
      run: dotnet restore app/OHelper.sln --locked-mode
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: c#
    - name: Build
      run: dotnet build app/OHelper.sln --no-restore
    - name: Analyze
      uses: github/codeql-action/analyze@v4
